.gems{position:absolute;right:10%;top:10px;width:60px}
.field{display:flex;align-items:center;gap:14px;background:var(--field);border-radius:999px;padding:8px 16px 8px 8px;box-shadow:4px 4px 0 var(--edge);margin-bottom:22px}
.ico{flex:none;width:44px;height:44px;border-radius:50%;background:#dc8fab;display:grid;place-items:center;box-shadow:2px 3px 0 rgba(0,0,0,.2)}
.field input{flex:1;min-width:0;border:0;background:none;font:700 17px 'Nunito',sans-serif;color:var(--ink);outline:none}
.field input::placeholder{color:#7a5568}

.eye{border:0;background:none;cursor:pointer;padding:4px;display:grid}
.forgot{display:block;text-align:right;color:var(--link);font-size:15px;text-decoration:none;margin:-8px 4px 24px}
.login{width:100%;border:0;border-radius:999px;background:var(--btn);color:#fff;font:700 24px 'Fredoka',sans-serif;padding:16px;cursor:pointer;box-shadow:5px 5px 0 var(--edge);transition:transform .1s,box-shadow .1s}
.login:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--edge)}

.or{display:flex;align-items:center;gap:10px;margin:26px 0 16px;font-size:15px}
.or:before,.or:after{content:"";flex:1;height:2px;background:#b9779a;opacity:.6}
.socials{display:flex;justify-content:center;gap:22px}
.soc{width:60px;height:60px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 8px rgba(0,0,0,.18)}
.signup{margin-top:24px;font-size:16px}.signup a{color:var(--link);text-decoration:none}
#msg{min-height:20px;margin-top:12px;font-size:14px}
@media (prefers-reduced-motion:reduce){.login{transition:none}}

.card{transition:transform .6s ease,opacity .5s ease}
body.leaving .card{opacity:0;transform:scale(.9) translateY(-12px)}

.back{border:0;border-radius:999px;background:#7a1b27;color:#fff;font:700 20px 'Fredoka',sans-serif;padding:12px 36px;cursor:pointer;box-shadow:4px 4px 0 #2e0a0f}
.back:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #2e0a0f}
#next h2,#next p,#next .back{position:relative;z-index:1}
#next .box{position:absolute;overflow:hidden;z-index:0;pointer-events:none;border:3px solid #7a1b27;border-radius:16px;background:linear-gradient(160deg,rgba(255,252,242,.8),rgba(238,228,208,.8));box-shadow:4px 5px 0 rgba(46,10,15,.35);opacity:0;transform:rotate(var(--r)) translateY(20px) scale(.94);transition:opacity .3s,transform .3s}
#next.open .box{opacity:1;transform:rotate(var(--r));transition:opacity .7s var(--d),transform .7s var(--d)}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none;display:none}
#hb{position:fixed;left:0;right:0;top:46%;transform:translateY(-50%);z-index:21;text-align:center;pointer-events:none;display:none;font-family:'Fredoka',system-ui,sans-serif;font-weight:700}
#hb.show{display:block}
#hb .ln{display:block;white-space:nowrap;font-size:min(15vw,72px);line-height:1.08;color:#7a1b27;-webkit-text-stroke:8px #fff;paint-order:stroke fill;text-shadow:3px 4px 0 rgba(0,0,0,.28)}
#hb .l1{color:#d81b60}
#hb .l2{font-size:min(9.6vw,40px);margin-top:8px;-webkit-text-stroke:6px #fff}
#hb .ch{display:inline-block}
#hb.show .inner{animation:hbpop 2.6s cubic-bezier(.45,.05,.25,1) both,hbbounce 2.8s ease-in-out 2.6s infinite}
@keyframes hbbounce{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes hbpop{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){#hb .inner,#hb .ch{animation:none!important}}
#fx{position:fixed;inset:0;z-index:19;pointer-events:none;overflow:hidden}
.bl{position:absolute;bottom:-70px;line-height:1;animation:rise var(--t,7s) linear forwards}
@keyframes rise{0%{transform:translate(0,0) rotate(-6deg)}25%{transform:translate(18px,-28vh) rotate(6deg)}50%{transform:translate(-18px,-58vh) rotate(-6deg)}75%{transform:translate(18px,-88vh) rotate(6deg)}100%{transform:translate(0,-130vh) rotate(0)}}
.pp{position:absolute;font-size:34px;line-height:1;animation:pop 1.6s ease-out forwards}
@keyframes pop{0%{transform:scale(0) rotate(-20deg);opacity:0}25%{transform:scale(1.4) rotate(10deg);opacity:1}70%{transform:scale(1) rotate(0);opacity:1}100%{transform:scale(1.1) translateY(-30px);opacity:0}}
.box video{position:absolute;left:-10%;top:-10%;width:120%;height:120%;object-fit:cover;filter:blur(2px);opacity:.95}
.b1{--r:-6deg;--d:.5s;left:10%;top:17%;width:47%;height:18%}
.b2{--r:4deg;--d:.7s;left:56.5%;top:38%;width:37.5%;height:21%}
.b3{--r:-3deg;--d:.9s;left:12.5%;top:64.5%;width:33%;height:17%}
@media (prefers-reduced-motion:reduce){#next .box,#next.open .box{transition:none}}
@media (prefers-reduced-motion:reduce){#next,#next.open,.n-in,#next.open .n-in,.card{transition:none}}
#hb .stk{display:block;width:min(92vw,430px);margin:0 auto;filter:drop-shadow(0 0 5px rgba(255,255,255,.95)) drop-shadow(0 2px 3px rgba(0,0,0,.2))}
#hb .nm{font-family:'Allura','Great Vibes','Brush Script MT',cursive;font-weight:400;font-size:min(17vw,76px);line-height:1;color:#111;margin-top:4px;white-space:nowrap;text-shadow:0 0 6px #fff,0 0 10px #fff}
.bv{--r:0deg;--d:.5s;left:4%;top:13%;width:92%;height:74%}

#cd{position:fixed;left:52%;top:70%;width:min(38vw,160px);height:min(38vw,160px);transform:translate(-50%,-50%) scale(0);opacity:0;z-index:22;display:grid;place-items:center;pointer-events:none;transition:transform .6s cubic-bezier(.3,1.5,.5,1),opacity .4s}
#cd.on{transform:translate(-50%,-50%) scale(1);opacity:1}
#cd.off{transform:translate(-50%,-50%) scale(1.7);opacity:0;transition:transform .7s ease,opacity .5s}
#cd:before{display:none}
@keyframes cdpulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.45);opacity:0}}
#cd .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 8px rgba(255,160,200,.95))}
#cd .ring{display:none}
#cd .trk{fill:rgba(40,10,15,.4);stroke:rgba(255,255,255,.35)}
#cd .prg{fill:none;stroke:url(#cg);stroke-linecap:round;stroke-dasharray:327;stroke-dashoffset:0}
#cd.on .prg{animation:cdfill 3s linear forwards}
@keyframes cdfill{to{stroke-dashoffset:327}}
#cd .num{position:relative;font:700 min(24vw,92px)/1 'Fredoka',system-ui,sans-serif;color:#fff;-webkit-text-stroke:5px #7a1b27;paint-order:stroke fill;text-shadow:0 0 14px rgba(255,150,190,.95)}
#cd .num.tk{animation:cdtick .9s cubic-bezier(.2,.9,.3,1.4)}
@keyframes cdtick{0%{transform:scale(2.3);opacity:0}35%{transform:scale(.9);opacity:1}100%{transform:scale(1);opacity:1}}
#cd .lb{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);white-space:nowrap;font:700 18px 'Fredoka',sans-serif;color:#fff;-webkit-text-stroke:4px #7a1b27;paint-order:stroke fill}

<script>
var pw=document.getElementById('pw');
document.getElementById('eye').onclick=function(){var s=pw.type==='password';pw.type=s?'text':'password';this.setAttribute('aria-label',s?'Hide password':'Show password')};
var nx=document.getElementById('next');
var cv=document.getElementById('confetti'),cx=cv.getContext('2d'),parts=[],raf=0,cols=['#e63946','#f4a261','#ffd166','#06d6a0','#4cc9f0','#f72585','#b5179e','#ffffff'];
function fit(){var d=window.devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
function go(){if(thirdOpen)return;cv.style.display='block';if(!raf)raf=requestAnimationFrame(tick)}
function mk(x,y,vx,vy){parts.push({x:x,y:y,vx:vx,vy:vy,w:6+Math.random()*7,h:3+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0],o:Math.random()<.25})}
function burst(x,y,ang,n){for(var i=0;i<n;i++){var a=ang+(Math.random()-.5)*.9,sp=9+Math.random()*13;mk(x,y,Math.cos(a)*sp,Math.sin(a)*sp)}go()}
function rain(n){for(var i=0;i<n;i++)mk(Math.random()*innerWidth,-10,(Math.random()-.5)*2,2+Math.random()*3);go()}
function tick(){cx.clearRect(0,0,innerWidth,innerHeight);
parts=parts.filter(function(p){return p.y<innerHeight+30});
parts.forEach(function(p){p.vy+=.28;p.vx*=.985;p.vy*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.scale(1,Math.abs(Math.cos(p.r*1.7))+.15);cx.fillStyle=p.c;
if(p.o){cx.beginPath();cx.arc(0,0,p.h/1.5+1,0,6.3);cx.fill()}else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
if(parts.length){raf=requestAnimationFrame(tick)}else{raf=0;cv.style.display='none'}}
function party(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;fit();var w=innerWidth,h=innerHeight;
burst(0,h,-1,90);burst(w,h,-Math.PI+1,90);
setTimeout(function(){burst(w*.5,h*.92,-Math.PI/2,80)},500);
setTimeout(function(){burst(0,h*.8,-.9,70);burst(w,h*.8,-Math.PI+.9,70)},1100);
var k=0,t=setInterval(function(){rain(8);if(++k>25)clearInterval(t)},120)}
var fx=document.getElementById('fx'),started=0,em=['🎉','🎂','🎁','✨','🥳','🎊','💖'],bl=['🎈','🎈','🎈','🎀'];
function el(c,t,x,y){var s=document.createElement('span');s.className=c;s.textContent=t;s.style.left=x+'px';if(y!=null)s.style.top=y+'px';fx.appendChild(s);return s}
function balloon(){var b=el('bl',bl[Math.random()*bl.length|0],Math.random()*(innerWidth-50));b.style.setProperty('--t',(6+Math.random()*4)+'s');b.style.fontSize=(32+Math.random()*26)+'px';b.onanimationend=function(){b.remove()}}
function emo(x,y){var p=el('pp',em[Math.random()*em.length|0],x,y);p.onanimationend=function(){p.remove()}}
function sparkle(){var x=60+Math.random()*(innerWidth-120),y=80+Math.random()*innerHeight*.4,n=36;for(var i=0;i<n;i++){var a=i/n*6.283,sp=3+Math.random()*4;mk(x,y,Math.cos(a)*sp,Math.sin(a)*sp)}go()}
var festTimers=[],thirdOpen=0;
function stopFx(){thirdOpen=1;festTimers.forEach(clearInterval);festTimers=[];parts.length=0;var cvs=document.getElementById('confetti');if(cvs){var x=cvs.getContext&&cvs.getContext('2d');if(x)x.clearRect(0,0,cvs.width,cvs.height);cvs.style.display='none'}var f=document.getElementById('fx');if(f)f.innerHTML=''}
function fest(){if(started||matchMedia('(prefers-reduced-motion:reduce)').matches)return;started=1;party();
festTimers.push(setInterval(function(){rain(5)},300));
festTimers.push(setInterval(function(){var w=innerWidth,h=innerHeight;burst(0,h,-1,60);burst(w,h,-Math.PI+1,60)},2500));
festTimers.push(setInterval(function(){burst(innerWidth*Math.random(),innerHeight,-Math.PI/2,50)},1700));
festTimers.push(setInterval(sparkle,1200));
}
nx.addEventListener('click',function(e){burst(e.clientX,e.clientY,-Math.PI/2,45)});
function showHB(){document.getElementById('hb').classList.add('show')}
document.getElementById('f').onsubmit=function(e){e.preventDefault();
var r=document.querySelector('.login').getBoundingClientRect();
nx.style.setProperty('--x',(r.left+r.width/2)+'px');nx.style.setProperty('--y',(r.top+r.height/2)+'px');
document.body.classList.add('leaving');
nx.removeAttribute('inert');nx.setAttribute('aria-hidden','false');
setTimeout(startCD,900);requestAnimationFrame(function(){nx.classList.add('open');setTimeout(function(){showHB();fest()},550);nx.querySelectorAll('video').forEach(function(v){v.currentTime=0;var p=v.play();if(p&&p.catch)p.catch(function(){})})});};


function startCD(){var c=document.getElementById('cd'),n=document.getElementById('cdn'),k=3;
c.setAttribute('aria-hidden','false');c.classList.add('on');
function show(){n.textContent=k;n.classList.remove('tk');void n.offsetWidth;n.classList.add('tk');var r=c.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,-Math.PI/2,26)}
show();
var t=setInterval(function(){k--;show();if(k<=0){clearInterval(t);setTimeout(openThird,450)}},1000);
function openThird(){stopFx();var th=document.getElementById('third'),r=c.getBoundingClientRect();
th.style.setProperty('--x',(r.left+r.width/2)+'px');th.style.setProperty('--y',(r.top+r.height/2)+'px');
c.classList.add('off');th.setAttribute('aria-hidden','false');th.classList.add('open');var v=document.getElementById('vid');if(v){v.currentTime=0;var pr=v.play();if(pr&&pr.catch)pr.catch(function(){})}
}}

</script></body></html>
